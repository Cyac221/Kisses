<style>
  body{
    margin:0;
    height:100vh;
    background:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: Arial, Helvetica, sans-serif;
  }

  .broken-heart{
    font-size:120px;
    color:black;
    opacity:0;
    animation: fadeIn 2s ease forwards;
  }

  @keyframes fadeIn{
    from{
      opacity:0;
      transform:scale(0.8);
    }
    to{
      opacity:1;
      transform:scale(1);
    }
  }
</style>
