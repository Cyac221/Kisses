<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Isabelita por dios hija</title>
  <style>
    :root{
      --brand:#005A58;
      --bg:#f6fbfb;
      --card:#ffffff;
      --border: rgba(0,90,88,.20);
      --shadow: 0 16px 40px rgba(0,0,0,.10);
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:
        radial-gradient(900px 450px at 20% 10%, rgba(0,90,88,.10), transparent 60%),
        radial-gradient(900px 450px at 80% 90%, rgba(0,90,88,.10), transparent 60%),
        var(--bg);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--brand);
      padding: 24px;
    }

    main{
      width:min(920px, 100%);
      background:var(--card);
      border:1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 28px;
    }

    header{
      display:flex;
      flex-direction:column;
      gap:8px;
      margin-bottom:18px;
    }

    h1{
      margin:0;
      font-size: clamp(28px, 4vw, 40px);
      letter-spacing:-.6px;
      color:var(--brand);
    }

    p.sub{
      margin:0;
      font-size: clamp(14px, 2vw, 18px);
      opacity:.9;
      color:var(--brand);
    }

    .grid{
      display:grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-top: 18px;
    }

    @media (min-width: 860px){
      .grid{ grid-template-columns: 380px 1fr; align-items:start; }
    }

    .card{
      border:1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      background: #fff;
    }

    label{
      display:block;
      font-weight: 700;
      margin-bottom: 10px;
      color:var(--brand);
    }

    .row{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap: wrap;
    }

    input[type="number"]{
      flex:1;
      min-width: 140px;
      padding: 12px 12px;
      border-radius: 12px;
      border:1px solid var(--border);
      outline:none;
      font-size: 16px;
      color: var(--brand);
      background: rgba(0,90,88,.03);
    }

    input[type="number"]:focus{
      box-shadow: 0 0 0 4px rgba(0,90,88,.18);
      border-color: rgba(0,90,88,.45);
    }

    button{
      padding: 12px 14px;
      border-radius: 12px;
      border:1px solid rgba(0,90,88,.35);
      background: var(--brand);
      color: #fff;
      font-weight: 700;
      cursor:pointer;
      transition: transform .08s ease, filter .2s ease;
      user-select:none;
    }

    button:hover{ filter: brightness(1.05); }
    button:active{ transform: translateY(1px) scale(.99); }
    button.secondary{
      background: transparent;
      color: var(--brand);
    }

    .hint{
      margin: 10px 0 0 0;
      font-size: 13px;
      opacity:.85;
    }

    .status{
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      border:1px dashed rgba(0,90,88,.35);
      background: rgba(0,90,88,.04);
      min-height: 44px;
      display:flex;
      align-items:center;
      gap:10px;
    }

    .dot{
      width:10px; height:10px;
      border-radius:999px;
      background: rgba(0,90,88,.35);
    }

    .dot.pulse{
      animation: pulse 1.1s ease-in-out infinite;
    }

    @keyframes pulse{
      0%{ transform: scale(.85); opacity:.5; }
      50%{ transform: scale(1.15); opacity:1; }
      100%{ transform: scale(.85); opacity:.5; }
    }

    /* Zona de “besos” */
    .kiss-zone{
      position: relative;
      overflow: hidden;
      min-height: 360px;
      border-radius: 16px;
      border:1px solid var(--border);
      background:
        radial-gradient(520px 240px at 30% 20%, rgba(0,90,88,.10), transparent 60%),
        radial-gradient(520px 240px at 80% 85%, rgba(0,90,88,.10), transparent 60%),
        #fff;
    }

    .kiss-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }

    .kiss-header strong{
      color:var(--brand);
    }

    .counter{
      font-variant-numeric: tabular-nums;
      opacity:.9;
    }

    .kisses{
      padding: 14px;
      display:flex;
      flex-wrap: wrap;
      gap: 10px;
      align-content:flex-start;
      min-height: 320px;
    }

    .kiss{
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display:grid;
      place-items:center;
      border:1px solid rgba(0,90,88,.25);
      background: rgba(0,90,88,.05);
      transform: translateY(10px) scale(.9);
      opacity: 0;
      animation: pop .38s ease forwards;
      position: relative;
    }

    .kiss::after{
      content:"";
      position:absolute;
      inset:-6px;
      border-radius: 18px;
      border:1px solid rgba(0,90,88,.14);
      opacity:0;
      animation: ring .9s ease forwards;
    }

    @keyframes pop{
      to{ transform: translateY(0) scale(1); opacity: 1; }
    }

    @keyframes ring{
      0%{ opacity:.55; transform: scale(.95); }
      100%{ opacity:0; transform: scale(1.18); }
    }

    .kiss span{
      font-size: 20px;
      line-height: 1;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,.08));
    }

    .shake{
      animation: shake .35s ease;
    }
    @keyframes shake{
      0%{ transform: translateX(0); }
      25%{ transform: translateX(-6px); }
      50%{ transform: translateX(6px); }
      75%{ transform: translateX(-4px); }
      100%{ transform: translateX(0); }
    }

    .note{
      margin: 14px 0 0 0;
      font-size: 12px;
      opacity:.8;
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>Isabelita por dios hija!</h1>
      <p class="sub">Si me descuidas te monto una aplicación completa :D</p>
    </header>

    <section class="grid" aria-label="Calculadora de besitos">
      <div class="card" id="panel">
        <label for="qty">Cuantos besitos quieres hoy?</label>
        <div class="row">
          <input id="qty" type="number" min="0" step="1" placeholder="Sin pena" inputmode="numeric" />
          <button id="go">Enviar</button>
          <button id="stop" class="secondary" title="Detener impresión">Detener</button>
        </div>
        <p class="hint">Si pides más de 1000 se me colapsa la jeta, asi que con prudencia</p>

        <div class="status" role="status" aria-live="polite">
          <div class="dot" id="dot"></div>
          <div id="msg">Realiza aqui tu pedido. Con responsabilidad emocional porfis.</div>
        </div>

        <p class="note">Con mucho cariño <code> ISABELITA </code>No me dañes el programita jijjiji.</p>
      </div>

      <div class="kiss-zone">
        <div class="kiss-header">
          <strong>Impresora de besitos</strong>
          <div class="counter"><span id="printed">0</span> / <span id="target">0</span></div>
        </div>
        <div class="kisses" id="kisses"></div>
      </div>
    </section>
  </main>

  <script>
    // DOM
    const qty = document.getElementById('qty');
    const go = document.getElementById('go');
    const stopBtn = document.getElementById('stop');

    const panel = document.getElementById('panel');
    const kisses = document.getElementById('kisses');

    const msg = document.getElementById('msg');
    const dot = document.getElementById('dot');

    const printedEl = document.getElementById('printed');
    const targetEl = document.getElementById('target');

    // Async control
    let cancel = false;

    const sleep = (ms) => new Promise(r => setTimeout(r, ms));

    function setStatus(text, loading=false){
      msg.textContent = text;
      dot.classList.toggle('pulse', loading);
    }

    function resetBoard(target){
      kisses.innerHTML = '';
      printedEl.textContent = '0';
      targetEl.textContent = String(target);
    }

    function shake(){
      panel.classList.remove('shake');
      // reflow para reiniciar animación
      void panel.offsetWidth;
      panel.classList.add('shake');
    }

    async function printKisses(n){
      cancel = false;
      resetBoard(n);
      setStatus('Imprimiendo besitos…', true);

      const chunk = 24; // imprime en lotes para rendimiento
      let printed = 0;

      while(printed < n && !cancel){
        const toAdd = Math.min(chunk, n - printed);

        // Crear en memoria y luego añadir (más rápido que append uno a uno con reflow pesado)
        const frag = document.createDocumentFragment();
        for(let i=0; i<toAdd; i++){
          const cell = document.createElement('div');
          cell.className = 'kiss';
          const s = document.createElement('span');
          s.textContent = '💋';
          cell.appendChild(s);
          frag.appendChild(cell);
        }
        kisses.appendChild(frag);

        printed += toAdd;
        printedEl.textContent = String(printed);

        // Pausa asíncrona para mantener UI fluida
        await sleep(45);
      }

      if(cancel){
        setStatus('Impresión detenida. Los besos restantes se guardan para luego (o para chantaje).', false);
      }else{
        setStatus('Pedido completado. Besitos entregados sin sobrecostos logísticos.', false);
      }
    }

    go.addEventListener('click', async () => {
      const raw = qty.value.trim();
      const n = Number(raw);

      if(!raw || Number.isNaN(n) || !Number.isFinite(n) || n < 0){
        shake();
        setStatus('Poné un número válido, cansona! No se vale “infinito” ni “depende” ¬¬', false);
        return;
      }

      const intN = Math.floor(n);

      if(intN > 1000){
        shake();
        setStatus('Te dije que no me rompieras el programa con más de 1000 besitos!', false);
        return;
      }

      if(intN === 0){
        resetBoard(0);
        setStatus('¿Cero besitos?… ok. Fuerte decisión.', false);
        return;
      }

      await printKisses(intN);
    });

    stopBtn.addEventListener('click', () => {
      cancel = true;
    });

    // UX: enter para enviar
    qty.addEventListener('keydown', (e) => {
      if(e.key === 'Enter') go.click();
    });
  </script>
</body>
</html>
