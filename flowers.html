<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <style>
    :root{
      --bg1:#0b1320;
      --bg2:#0f2236;
      --table:#0b0f16;
      --shadow: rgba(0,0,0,.35);
      --green1:#2fbf71;
      --green2:#1e8f54;
      --sunPetal:#ffc400;
      --sunPetal2:#ffb300;
      --sunPetal3:#ffd84a;
      --sunCenter:#2b1a12;
      --sunCenter2:#3b2419;
      --carn:#ff6b7a;
      --carn2:#ff4f63;
      --carn3:#ff93a0;
      --vase:#2aa7ff;
      --vase2:#1d6ed1;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background: radial-gradient(1200px 700px at 50% 20%, #1a2f4a 0%, var(--bg2) 40%, var(--bg1) 100%);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:#eaf2ff;
      overflow:hidden;
    }

    .scene{
      width:min(980px, 94vw);
      height:min(620px, 86vh);
      position:relative;
      border-radius:24px;
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
      overflow:hidden;
    }

    .scene::before{
      content:"";
      position:absolute;
      inset:-40%;
      background:
        radial-gradient(closest-side at 25% 30%, rgba(72,167,255,.20), transparent 70%),
        radial-gradient(closest-side at 70% 25%, rgba(255,210,0,.12), transparent 72%),
        radial-gradient(closest-side at 75% 70%, rgba(255,104,140,.16), transparent 72%);
      filter: blur(18px);
      opacity:.9;
      pointer-events:none;
    }

    .nav{
  position:absolute;
  top:16px;
  left:16px;
  display:flex;
  gap:10px;
  z-index: 20;
  padding:10px 12px;
  border-radius:999px;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.14);
  backdrop-filter: blur(10px);
}
.nav a{
  text-decoration:none;
  color:#eaf2ff;
  font-weight:700;
  padding:8px 12px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.16);
  background: rgba(255,255,255,.06);
}
.nav a:hover{ background: rgba(255,255,255,.12); }
.nav a.active{ background: rgba(255,255,255,.18); }


    .table{
      position:absolute;
      left:0; right:0;
      bottom:0;
      height:32%;
      background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.10) 8%, var(--table) 40%, #05070b 100%);
    }
    .table::after{
      content:"";
      position:absolute;
      left:0; right:0; top:-10px;
      height:24px;
      background: radial-gradient(1200px 32px at 50% 0%, rgba(255,255,255,.16), transparent 70%);
      opacity:.25;
    }

    .vase-wrap{
      position:absolute;
      left:50%;
      bottom:12%;
      transform:translateX(-50%);
      width:220px;
      height:168px;
      filter: drop-shadow(0 18px 20px var(--shadow));
      z-index:4;
    }
    .vase-mouth{
      position:absolute;
      top:-10px;
      left:6%;
      right:6%;
      height:26px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,.20), rgba(255,255,255,.02));
      border:1px solid rgba(255,255,255,.18);
      backdrop-filter: blur(4px);
    }
    .vase{
      position:absolute;
      inset:0;
      border-radius: 34px 34px 48px 48px / 30px 30px 56px 56px;
      background:
        radial-gradient(140px 170px at 40% 40%, rgba(255,255,255,.22), transparent 55%),
        radial-gradient(160px 150px at 70% 50%, rgba(255,255,255,.10), transparent 60%),
        linear-gradient(180deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,.06) 18%, rgba(255,255,255,.03) 100%),
        linear-gradient(180deg, var(--vase) 0%, var(--vase2) 100%);
      border: 1px solid rgba(220,250,255,.22);
      overflow:hidden;
    }
    .vase::before{
      content:"";
      position:absolute;
      left:16px; top:12px;
      width:34px; height:88%;
      background: linear-gradient(180deg, rgba(255,255,255,.38), rgba(255,255,255,.02));
      border-radius:999px;
      transform: rotate(6deg);
      opacity:.45;
    }
    .vase::after{
      content:"";
      position:absolute;
      left:-10%;
      right:-10%;
      top:10%;
      height:22%;
      background: linear-gradient(180deg, rgba(255,255,255,.20), rgba(255,255,255,0));
      opacity:.22;
    }
    .waterline{
      position:absolute;
      left:8%;
      right:8%;
      bottom:26%;
      height:4px;
      background: rgba(180, 240, 255, .26);
      border-radius:999px;
      filter: blur(.2px);
    }

    .bouquet{
      position:absolute;
      left:50%;
      bottom:22%;
      transform:translateX(-50%);
      width:360px;
      height:520px;
      z-index:3;
      pointer-events:none;
    }

    .stem{
      position:absolute;
      left:50%;
      bottom:0;
      width:10px;
      height:280px;
      transform-origin: bottom center;
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.12)),
                  linear-gradient(180deg, var(--green1) 0%, var(--green2) 100%);
      border-radius: 999px;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,.22));
    }
    .stem::before{
      content:"";
      position:absolute;
      left:50%;
      top:40%;
      width:44px;
      height:18px;
      transform: translateX(-50%) rotate(-18deg);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.12)),
                  linear-gradient(180deg, #34d07a 0%, #1f8e55 100%);
      border-radius: 999px 999px 999px 12px;
      clip-path: polygon(0 55%, 35% 0, 100% 45%, 35% 100%);
      opacity:.95;
    }

    .flower{
      position:absolute;
      left:50%;
      bottom:0;
      width:1px;
      height:1px;
      transform-origin: bottom center;
      will-change: transform;
    }

    .bloom{
      position:absolute;
      left:0;
      transform: translateX(-50%) scale(var(--s,1));
      transform-origin: center;
      will-change: transform, filter;
      filter: drop-shadow(0 10px 14px rgba(0,0,0,.25));
    }

    /* ===== GIRASOL MEJORADO ===== */
    .sunflower{ width:176px; height:176px; } /* un poco más grande */
    .sunflower .petals, .sunflower .petals2{
      position:absolute; inset:0;
      border-radius:50%;
      transform: scale(var(--open, 0.2));
      transition: transform 900ms cubic-bezier(.2,.8,.2,1);
      will-change: transform;
    }
    .sunflower .petal{
      position:absolute;
      left:50%;
      top:50%;
      width:24px;
      height:84px;               /* más largo */
      transform-origin: 50% 92%;
      border-radius: 999px 999px 38px 38px;
      background:
        radial-gradient(circle at 35% 22%, rgba(255,255,255,.35), transparent 48%),
        linear-gradient(180deg, var(--sunPetal3) 0%, var(--sunPetal) 30%, var(--sunPetal2) 100%);
      box-shadow:
        inset 0 0 0 1px rgba(0,0,0,.10),
        inset 0 -14px 16px rgba(0,0,0,.10);
      filter: saturate(1.05);
      animation: petalWiggle 3.0s ease-in-out infinite;
      animation-delay: var(--pd, 0s);
    }
    /* segunda corona de pétalos, más corta y rotada */
    .sunflower .petals2 .petal{
      width:22px;
      height:70px;
      opacity:.95;
      filter: saturate(1.0) brightness(0.98);
    }

    .sunflower .center{
      position:absolute;
      left:50%;
      top:50%;
      width:92px;                 /* centro más grande */
      height:92px;
      transform: translate(-50%,-50%) scale(var(--open, 0.2));
      transition: transform 900ms cubic-bezier(.2,.8,.2,1);
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, rgba(255,255,255,.10), transparent 55%),
        radial-gradient(circle at 60% 70%, rgba(0,0,0,.24), transparent 58%),
        radial-gradient(circle, var(--sunCenter2) 0%, var(--sunCenter) 62%, #1b0f0b 100%);
      box-shadow:
        inset 0 0 0 2px rgba(0,0,0,.22),
        0 0 0 2px rgba(255,255,255,.04);
    }
    .sunflower .seeds{
      position:absolute;
      inset:10px;
      border-radius:50%;
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,.10), transparent 45%),
        radial-gradient(circle at 68% 72%, rgba(0,0,0,.28), transparent 58%),
        repeating-radial-gradient(circle, rgba(0,0,0,.0) 0 5px, rgba(0,0,0,.18) 5px 6px);
      opacity:.65;
    }

    /* CLAVEL */
    .carnation{ width:140px; height:140px; }
    .carnation .ruffles{
      position:absolute; inset:0;
      transform: scale(var(--open, 0.2));
      transition: transform 900ms cubic-bezier(.2,.8,.2,1);
      will-change: transform;
    }
    .carnation .ruffle{
      position:absolute;
      left:50%;
      top:50%;
      width:90px;
      height:90px;
      transform: translate(-50%,-50%) rotate(var(--r,0deg)) scale(var(--k,1));
      border-radius: 55% 45% 60% 40% / 55% 60% 40% 45%;
      background:
        radial-gradient(circle at 35% 35%, rgba(255,255,255,.18), transparent 55%),
        linear-gradient(180deg, var(--carn3) 0%, var(--carn) 35%, var(--carn2) 100%);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.10),
        inset 0 -10px 18px rgba(0,0,0,.10);
      clip-path: polygon(
        50% 0%,
        60% 6%, 72% 2%, 78% 10%,
        88% 12%, 92% 22%, 100% 28%,
        94% 38%, 98% 50%, 92% 60%,
        100% 70%, 90% 78%, 86% 90%,
        74% 92%, 62% 100%, 50% 94%,
        38% 100%, 26% 92%, 14% 90%,
        10% 78%, 0% 70%, 8% 60%,
        2% 50%, 6% 38%, 0% 28%,
        8% 22%, 12% 12%, 22% 10%,
        28% 2%, 40% 6%
      );
      opacity:.95;
      animation: ruffleBreath 2.6s ease-in-out infinite;
      animation-delay: var(--pd, 0s);
    }
    .carnation .core{
      position:absolute;
      left:50%;
      top:50%;
      width:44px;
      height:44px;
      transform: translate(-50%,-50%) scale(var(--open, 0.2));
      transition: transform 900ms cubic-bezier(.2,.8,.2,1);
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 35%, rgba(255,255,255,.16), transparent 55%),
        linear-gradient(180deg, #ffadba 0%, #ff5c6f 55%, #ff3d55 100%);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.10);
    }

    @keyframes sway {
      0%   { transform: translateX(var(--x,0px)) rotate(calc(var(--base,0deg) - 2.0deg)); }
      50%  { transform: translateX(var(--x,0px)) rotate(calc(var(--base,0deg) + 2.0deg)); }
      100% { transform: translateX(var(--x,0px)) rotate(calc(var(--base,0deg) - 2.0deg)); }
    }
    @keyframes nod {
      0%   { transform: translateX(-50%) translateY(0) rotate(-1deg) scale(var(--s,1)); }
      50%  { transform: translateX(-50%) translateY(2px) rotate(1deg)  scale(var(--s,1)); }
      100% { transform: translateX(-50%) translateY(0) rotate(-1deg) scale(var(--s,1)); }
    }
    @keyframes petalWiggle {
      0%,100% { transform: rotate(var(--deg)) translateY(-58px) rotate(calc(-1 * var(--deg))) scaleY(1); }
      50%     { transform: rotate(calc(var(--deg) + 1.2deg)) translateY(-58px) rotate(calc(-1 * var(--deg))) scaleY(.985); }
    }
    @keyframes ruffleBreath {
      0%,100% { transform: translate(-50%,-50%) rotate(var(--r,0deg)) scale(var(--k,1)); }
      50%     { transform: translate(-50%,-50%) rotate(calc(var(--r,0deg) + 1.0deg)) scale(calc(var(--k,1) * 1.02)); }
    }

    .flower.sway{ animation: sway var(--t, 4.8s) ease-in-out infinite; }
    .bloom.nod{ animation: nod 3.2s ease-in-out infinite; animation-delay: var(--d, 0s); }

    /* UI */
    .ui{
      position:absolute;
      top:16px;
      left:16px;
      right:16px;
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      z-index:10;
      pointer-events:auto;
    }
    .chip{
      display:inline-flex;
      gap:10px;
      align-items:center;
      padding:10px 12px;
      border-radius:999px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 28px rgba(0,0,0,.22);
    }
    .btn{
      appearance:none;
      border:none;
      cursor:pointer;
      padding:10px 12px;
      border-radius:999px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.16);
      color:#eaf2ff;
      font-weight:600;
      transition: transform 140ms ease, background 140ms ease;
    }
    .btn:active{ transform: translateY(1px) scale(.99); }
    .btn:hover{ background: rgba(255,255,255,.14); }
    .hint{ opacity:.85; font-size:13px; line-height:1.2; }
  </style>
</head>

<body>
  <div class="scene">
    <div class="ui">
      <div class="chip">
        <button class="btn" id="btnGrow">Florecer</button>
        <button class="btn" id="btnReset">Otra vez</button>
      </div>
      <div class="chip hint" id="status">Listo.</div>
    </div>

    <div class="bouquet" id="bouquet"></div>

    <div class="vase-wrap" aria-hidden="true">
      <div class="vase-mouth"></div>
      <div class="vase">
        <div class="waterline"></div>
      </div>
    </div>

    <div class="table"></div>
  </div>

  <script>
    const $ = (sel, root=document) => root.querySelector(sel);
    const rand = (a,b) => a + Math.random()*(b-a);
    const randi = (a,b) => Math.floor(rand(a,b+1));
    const sleep = (ms) => new Promise(res => setTimeout(res, ms));
    const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

    const bouquet = $("#bouquet");
    const statusEl = $("#status");
    const FLOWER_COUNT = 12;
    const INSERT_IN_VASE = 74;

    function clearBouquet(){ bouquet.innerHTML = ""; }

    function makeStem(heightPx){
      const stem = document.createElement("div");
      stem.className = "stem";
      stem.style.height = `${heightPx}px`;
      return stem;
    }

    // ===== Girasol: doble corona + centro más grande + semillas más marcadas =====
    function makeSunflower(){
      const root = document.createElement("div");
      root.className = "bloom sunflower nod";

      const petals = document.createElement("div");
      petals.className = "petals";

      const petals2 = document.createElement("div");
      petals2.className = "petals2";

      const outerCount = 24;
      const innerCount = 18;

      // Corona exterior
      for(let i=0;i<outerCount;i++){
        const p = document.createElement("div");
        p.className = "petal";
        const deg = (360/outerCount)*i + rand(-1.6,1.6);
        p.style.setProperty("--deg", `${deg}deg`);
        p.style.setProperty("--pd", `${rand(0,1.0)}s`);
        // más abierto: se nota la “estrella” del girasol
        p.style.transform = `rotate(${deg}deg) translateY(-66px) rotate(${-deg}deg)`;
        petals.appendChild(p);
      }

      // Corona interior (rotada)
      const offset = 360/(outerCount*2);
      for(let i=0;i<innerCount;i++){
        const p = document.createElement("div");
        p.className = "petal";
        const deg = (360/innerCount)*i + offset + rand(-1.2,1.2);
        p.style.setProperty("--deg", `${deg}deg`);
        p.style.setProperty("--pd", `${rand(0,1.0)}s`);
        p.style.transform = `rotate(${deg}deg) translateY(-56px) rotate(${-deg}deg)`;
        petals2.appendChild(p);
      }

      const center = document.createElement("div");
      center.className = "center";
      const seeds = document.createElement("div");
      seeds.className = "seeds";
      center.appendChild(seeds);

      root.appendChild(petals);
      root.appendChild(petals2);
      root.appendChild(center);
      return { root };
    }

    function makeCarnation(){
      const root = document.createElement("div");
      root.className = "bloom carnation nod";

      const ruffles = document.createElement("div");
      ruffles.className = "ruffles";

      const layers = 6;
      for(let i=0;i<layers;i++){
        const rf = document.createElement("div");
        rf.className = "ruffle";
        rf.style.setProperty("--r", `${rand(0,360)}deg`);
        rf.style.setProperty("--k", `${0.92 - i*0.07}`);
        rf.style.setProperty("--pd", `${rand(0,1.2)}s`);
        const hueShift = rand(-6, 6);
        rf.style.filter = `saturate(1.12) hue-rotate(${hueShift}deg)`;
        ruffles.appendChild(rf);
      }

      const core = document.createElement("div");
      core.className = "core";

      root.appendChild(ruffles);
      root.appendChild(core);
      return { root };
    }

    function bouquetSlots(){
      return [
        { x:   0,  y:  0,  h: 290, s: 1.00, z: 95, kind:"carnation" },
        { x: -28,  y:  6,  h: 285, s: 0.98, z: 92, kind:"carnation" },
        { x:  28,  y:  6,  h: 285, s: 0.98, z: 92, kind:"carnation" },

        { x: -58,  y: 14,  h: 275, s: 0.95, z: 86, kind:"carnation" },
        { x:  58,  y: 14,  h: 275, s: 0.95, z: 86, kind:"carnation" },
        { x: -86,  y: 20,  h: 265, s: 0.92, z: 80, kind:"carnation" },
        { x:  86,  y: 20,  h: 265, s: 0.92, z: 80, kind:"carnation" },

        { x: -40,  y: 28,  h: 305, s: 0.90, z: 74, kind:"carnation" },
        { x:  40,  y: 28,  h: 305, s: 0.90, z: 74, kind:"carnation" },

        { x: -78,  y: 34,  h: 430, s: 1.05, z: 70, kind:"sunflower" },
        { x:  78,  y: 34,  h: 450, s: 1.08, z: 70, kind:"sunflower" },

        { x:   0,  y: 40,  h: 320, s: 0.88, z: 68, kind:"carnation" },
      ];
    }

    function makeFlowerInstance(kind, slot){
      const wrapper = document.createElement("div");
      wrapper.className = "flower sway";
      wrapper.style.left = "50%";
      wrapper.style.bottom = "0";
      wrapper.style.zIndex = String(slot.z);

      const jitterX = (kind === "sunflower") ? 2 : 3;
      const jitterY = 3;

      const x = slot.x + (Math.random()*2 - 1) * jitterX;
      const base = clamp((x/200)*9 + (Math.random()*2-1)*1.2, -12, 12);
      const t = 4.9 + Math.random()*0.8;
      const delay = Math.random()*0.7;

      wrapper.style.setProperty("--x", `${x}px`);
      wrapper.style.setProperty("--base", `${base}deg`);
      wrapper.style.setProperty("--t", `${t}s`);
      wrapper.style.setProperty("--d", `${delay}s`);

      const stemH =
        kind === "sunflower"
          ? Math.round(slot.h + randi(-8, 16))
          : Math.round(slot.h + randi(-16, 26));

      const stem = makeStem(stemH);
      const parts = (kind === "sunflower") ? makeSunflower() : makeCarnation();

      const scale = slot.s * (kind === "sunflower" ? 1.03 : 1.00);
      parts.root.style.setProperty("--s", scale.toFixed(3));

      parts.root.style.bottom = `${stemH - INSERT_IN_VASE - (slot.y + (Math.random()*2-1)*jitterY)}px`;

      wrapper.appendChild(stem);
      wrapper.appendChild(parts.root);
      wrapper.dataset.open = "0";
      return { wrapper, kind };
    }

    function setOpen(flower, open01){
      const v = clamp(open01, 0, 1);
      const open = (0.2 + 0.8*v).toFixed(3);
      flower.wrapper.querySelectorAll(".petals, .petals2, .center, .ruffles, .core").forEach(node=>{
        node.style.setProperty("--open", open);
      });
      flower.wrapper.dataset.open = String(v);
    }

    function buildBouquet(){
      bouquet.innerHTML = "";
      const slots = bouquetSlots();
      const take = Math.min(FLOWER_COUNT, slots.length);
      const flowers = [];

      for(let i=0;i<take;i++){
        const slot = slots[i];
        const f = makeFlowerInstance(slot.kind, slot);
        bouquet.appendChild(f.wrapper);
        flowers.push(f);
      }
      return flowers;
    }

    async function bloomSequence(flowers){
      statusEl.textContent = "Están naciendo las flores de isabelita";
      for(const f of flowers){
        const target = (f.kind === "sunflower") ? rand(0.92, 1.0) : rand(0.80, 0.98);
        setOpen(f, 0.12);
        await sleep(randi(90, 140));
        setOpen(f, 0.55);
        await sleep(randi(140, 210));
        setOpen(f, target);
        await sleep(randi(80, 140));
      }
      statusEl.textContent = ":)";
    }

    async function resetSequence(flowers){
      statusEl.textContent = "Reiniciando…";
      flowers.forEach(f => setOpen(f, 0));
      await sleep(220);
      flowers.forEach(f => setOpen(f, 0.08));
      statusEl.textContent = ":)";
    }

    function startBreeze(){
      function tick(t){
        const list = Array.from(bouquet.querySelectorAll(".flower"));
        for(const el of list){
          const base = parseFloat(getComputedStyle(el).getPropertyValue("--base")) || 0;
          const wobble = Math.sin((t/1000) * 0.55 + base) * 0.08;
          el.style.setProperty("--base", `${clamp(base + wobble, -14, 14)}deg`);
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    let flowers = buildBouquet();
    flowers.forEach(f => setOpen(f, 0.10));
    startBreeze();

    $("#btnGrow").addEventListener("click", async () => { await bloomSequence(flowers); });
    $("#btnReset").addEventListener("click", async () => {
      await resetSequence(flowers);
      flowers = buildBouquet();
      flowers.forEach(f => setOpen(f, 0.08));
      statusEl.textContent = "Para ti, siempre.";
    });

    (async () => {
      await sleep(240);
      await bloomSequence(flowers);
    })();
  </script>
</body>
</html>
